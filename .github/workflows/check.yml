name: Check

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly: reports live-site availability
  workflow_dispatch:

jobs:
  plugins:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: --cfg reqwest_unstable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KidiXDev/aikatsu
          path: aikatsu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aikatsu
      - name: Build aikatsu-plugin
        run: cargo build -p aikatsu-core --bin aikatsu-plugin --manifest-path aikatsu/Cargo.toml
      - name: Checksums are current
        run: |
          aikatsu/target/debug/aikatsu-plugin index .
          git diff --exit-code index.json || { echo "::error::run 'aikatsu-plugin index .' and commit index.json"; exit 1; }
      - name: Tests
        run: aikatsu/target/debug/aikatsu-plugin test .
      - name: Live sites
        id: live
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # Sites can challenge CI runner IPs or time out while working for users.
        continue-on-error: true
        run: aikatsu/target/debug/aikatsu-plugin live .
      - name: Report live-site failures
        if: steps.live.outcome == 'failure'
        run: echo "::warning::Live-site checks failed. Review the Live sites log; runner IP blocks and timeouts do not necessarily mean a plugin is broken."
